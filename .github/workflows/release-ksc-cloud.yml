name: Release KSC to Cloud Storage

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to build (e.g., v0.44.0)'
        required: true
        type: string
        default: 'v0.44.0'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-upload-ksc:
    name: Build and upload KSC
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - build: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - build: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - build: darwin
            os: macos-latest
            target: x86_64-apple-darwin
          - build: win32
            os: windows-latest
            target: x86_64-pc-windows-msvc
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}
          fetch-depth: 0

      - name: Validate tag exists
        shell: bash
        run: |
          if ! git rev-parse "${{ github.event.inputs.release_tag }}" >/dev/null 2>&1; then
            echo "Error: Tag '${{ github.event.inputs.release_tag }}' does not exist!"
            echo "Available tags starting with 'v':"
            git tag -l "v*" --sort=-v:refname | head -20
            exit 1
          fi

      - name: Set version
        shell: bash
        run: echo "VERSION=${{ github.event.inputs.release_tag }}" >> $GITHUB_ENV

      - name: Install Rust
        if: ${{ matrix.os != 'windows-latest' }}
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Install Rust
        run: |
          rustup default stable
          rustup update
          rustup target add ${{ matrix.target }}

      - name: Cargo Cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
            ${{ runner.os }}-cargo-

      - name: Cargo Target Cache
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-${{ hashFiles('Cargo.lock') }}
            ${{ runner.os }}-cargo-target-

      - name: Install dependencies
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            sudo apt update && sudo apt install -y --no-install-recommends \
              clang clang-tools llvm build-essential || exit 1
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            brew install scdoc
            rustup update && rustup target add aarch64-apple-darwin
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            echo "No additional dependencies needed for Windows"
          fi

      - name: Build KSC
        shell: bash
        run: |
          RUST_BACKTRACE=full \
          RUSTFLAGS='-C target-feature=+crt-static' \
          cargo build -p klever-sc-meta --target ${{ matrix.target }} --release

      - name: Build archive
        shell: bash
        run: |
          src_binary_name="sc-meta"
          binary_name="ksc"
          dirname="$binary_name-${{ env.VERSION }}-${{ matrix.target }}"
          mkdir "$dirname"
          
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv "target/${{ matrix.target }}/release/$src_binary_name.exe" "$dirname/$binary_name.exe"
          else
            mv "target/${{ matrix.target }}/release/$src_binary_name" "$dirname/$binary_name"
          fi

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "$dirname.zip" "$dirname"
            echo "ASSET=$dirname.zip" >> $GITHUB_ENV
            echo "BINARY=$dirname/$binary_name.exe" >> $GITHUB_ENV
          else
            tar -czf "$dirname.tar.gz" "$dirname"
            echo "ASSET=$dirname.tar.gz" >> $GITHUB_ENV
            echo "BINARY=$dirname/$binary_name" >> $GITHUB_ENV
          fi

      - name: Configure GCP service account
        uses: google-github-actions/auth@v0
        with:
          credentials_json: '${{ secrets.GCP_CLOUD_RUN_SA }}'

      - name: Upload archive to bucket
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: ${{ env.ASSET }}
          destination: 'kleverchain-public/ksc/${{ matrix.build }}/${{ env.VERSION }}'

      - name: Upload binary to bucket
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: ${{ env.BINARY }}
          destination: 'kleverchain-public/ksc/${{ matrix.build }}/${{ env.VERSION }}'

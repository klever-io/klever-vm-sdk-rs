[package]
name = "format-tests"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "format-tests"
path = "src/format_tests.rs"

[dependencies.klever-sc]
version = "0.45.1"
path = "../../../framework/base"

[dependencies.klever-sc-scenario]
version = "0.45.1"
path = "../../../framework/scenario"

[dependencies.klever-chain-vm]
version = "0.6.1"
path = "../../../vm"

[dev-dependencies]
glob = "0.3.0"
home = "0.5.11"

[workspace]
members = ["."]

[dependencies]
hex = "0.4"
# Pinned to the version the root workspace locks. This crate has its own
# workspace and no committed Cargo.lock (tools/**/Cargo.lock is gitignored),
# so CI resolves num-bigint fresh. The LLDB pretty printer reads the internal
# `data` field of num_bigint::BigUint, and from 0.4.7 that layout reads as 0.
num-bigint = "=0.4.5"
